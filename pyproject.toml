[project]
name = "bkda"
version = "0.1.0"
description = "Study notes, case studies and exercises for Békés & Kézdi, Data Analysis for Business, Economics, and Policy"
authors = [{ name = "Felipe Sebben", email = "felipesebben@yahoo.com.br" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.2,<3",
    "scipy>=1.14.0",
    "statsmodels>=0.14.6",
    "scikit-learn>=1.5",
    "plotnine>=0.15.2",
    "mizani>=0.14",
    "matplotlib>=3.8.0,<3.9.1",
    "seaborn>=0.13.2",
    "plotly>=5.22",
    "wquantiles>=0.6",
    "python-dotenv>=1.0.1",
    "yfinance>=0.2.40",
    "wbgapi>=1.0.12",
]

[project.optional-dependencies]
# Web scraping used by a few ch01/ch02/ch03 exercises
scraping = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "selenium>=4.20",
    "webdriver-manager>=4.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bkda"]
